<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="stylesheet" href="./assets/uni.00bb6541.css">

    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./static/favicon.svg" />
    <title>时光记事</title>
    <style>
      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
        background: #f2f2f7;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body,
        #app {
          background: #000;
        }
      }
      .app-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: rgba(60, 60, 67, 0.6);
        background: #f2f2f7;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      .app-boot__mark {
        position: relative;
        width: 60px;
        height: 60px;
        border-radius: 14px;
        background: #007aff;
        box-shadow: 0 12px 28px rgba(0, 122, 255, 0.28);
      }
      .app-boot__mark::before {
        position: absolute;
        left: 18px;
        top: 12px;
        bottom: 12px;
        width: 2px;
        border-radius: 1px;
        background: rgba(255, 255, 255, 0.55);
        content: "";
      }
      .app-boot__mark::after {
        position: absolute;
        left: 14px;
        top: 16px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 16px 0 rgba(255, 255, 255, 0.85), 14px 8px 0 -2px rgba(255, 255, 255, 0.6);
        content: "";
        animation: app-boot-pulse 1.4s ease-in-out infinite;
      }
      .app-boot strong {
        color: #1c1c1e;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .app-boot span {
        margin-top: -10px;
        font-size: 13px;
      }
      @media (prefers-color-scheme: dark) {
        .app-boot {
          color: rgba(235, 235, 245, 0.6);
          background: #000;
        }
        .app-boot strong {
          color: #f5f5f7;
        }
        .app-boot__mark {
          background: #0a84ff;
        }
      }
      @keyframes app-boot-pulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot__mark::after {
          animation: none;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-159A8ifC.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-J90YP5H4.css">
  </head>
  <body>
    <div id="app">
      <div class="app-boot" aria-live="polite">
        <div class="app-boot__mark"></div>
        <strong>时光记事</strong>
        <span>正在打开时间轴…</span>
      </div>
    </div>
    <!-- 本地内置 Quill / highlight.js：uni editor 检测到 window.Quill 后不再请求 unpkg CDN -->
    <script defer src="./static/vendor/quill.min.js"></script>
    <script defer src="./static/vendor/highlight.min.js"></script>
  </body>
</html>
